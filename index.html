<style>
  /* Add custom styles for the visualizer */
  body{
    background-color: #1a1a1a;
  }
  canvas {
    max-width: 100%;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    border-radius: 4px;
  }
  
  .btn-outline-light {
    border-color: #aaa;
  }
  
  .card-header {
    background-color: #1a1a1a;
  }

  .rotary-field {
    display: grid;
    grid-template-columns: 60px 48px 68px;
    align-items: center;
    gap: 0.5rem;
    flex: 0 0 auto;
  }

  .rotary-control {
    position: relative;
    width: 48px;
    height: 48px;
    justify-self: center;
    border: 2px solid #777;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #666, #222 65%);
    box-shadow: 0 2px 5px rgba(0,0,0,0.45);
    cursor: ns-resize;
    outline: none;
    touch-action: none;
  }

  .rotary-control:hover,
  .rotary-control.is-dragging {
    border-color: #bbb;
  }

  .rotary-control:focus-visible {
    border-color: #03dac6;
    box-shadow: 0 0 0 3px rgba(3,218,198,0.35), 0 2px 5px rgba(0,0,0,0.45);
  }

  .rotary-pointer {
    position: absolute;
    inset: 5px;
    pointer-events: none;
  }

  .rotary-pointer::before {
    position: absolute;
    top: 0;
    left: 50%;
    width: 3px;
    height: 13px;
    border-radius: 2px;
    background: #03dac6;
    content: "";
    transform: translateX(-50%);
  }

  .rotary-field .eq-value {
    min-width: 68px;
    text-align: right;
  }
</style>
